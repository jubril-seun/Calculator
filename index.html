<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <main>
        <div class="container">
            
            <div class="input-wrapper">
                <p id="event-log" class="event-log">45 + 23 </p>
                <input type="text" id="input-result" class="input-result" placeholder="0">
            </div>
            <div class="calc-btns">
                <button data-id="esc" class="esc-btn secondary-btn">Esc</button>
                <button data-id="ac" class="ac-btn secondary-btn">AC</button>
                <button data-id="percent" class="percent-btn secondary-btn">&#37;</button>
                <button data-id="divide" class="divide-btn operation-btn">&#247;</button>
                <button data-id="7" class="seven-btn numeral-btn">7</button>
                <button data-id="8" class="eight-btn numeral-btn">8</button>
                <button data-id="9" class="nine-btn numeral-btn">9</button>
                <button data-id="multiply" class="multiply-btn operation-btn">&#215;</button>
                <button data-id="4" class="four-btn numeral-btn">4</button>
                <button data-id="5" class="five-btn numeral-btn">5</button>
                <button data-id="6" class="six-btn numeral-btn">6</button>
                <button data-id="minus" class="minus-btn operation-btn">&#8722;</button>
                <button data-id="1" class="one-btn numeral-btn">1</button>
                <button data-id="2" class="two-btn numeral-btn">2</button>
                <button data-id="3" class="three-btn numeral-btn">3</button>
                <button data-id="plus" class="plus-btn operation-btn">&#43;</button>
                <button data-id="0" class="zero-btn numeral-btn">0</button>
                <button data-id="decimal" class="decimal-btn numeral-btn">.</button>
                <button data-id="equals" class="equals-btn operation-btn">&#61;</button>
            </div>
        </div>
    </main>
</body>
</html>
